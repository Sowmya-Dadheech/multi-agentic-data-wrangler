# Optional: real Postgres + MongoDB to try SQL pushdown and Mongo sources locally.
#   docker compose up -d
#   wrangle run "postgresql+psycopg2://wrangler:wrangler@localhost:5432/shop::customers"
#   wrangle run "mongodb://localhost:27017::shop.orders"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wrangler
      POSTGRES_PASSWORD: wrangler
      POSTGRES_DB: shop
    ports: ["5432:5432"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
